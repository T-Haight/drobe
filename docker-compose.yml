services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drobe
      POSTGRES_PASSWORD: drobe
      POSTGRES_DB: drobe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://drobe:drobe@db:5432/drobe
      CORS_ORIGINS: http://localhost:8080
      STORAGE_PATH: /app/storage
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  backend_storage:
